# VATSIM ATC Tracker: Home Assistant package (logic).
#
# Do not edit this file. Everything specific to your house lives in
# vatsim_user.yaml, which this file calls:
#   script.vatsim_notify        where health and alert pushes go
#   script.vatsim_announce      your speaker map and TTS engine
#   input_text.vatsim_mute_gate optional entity that holds speech while it is not off
# Replacing this file with a newer release therefore never touches your settings.
#
# The vatsim sensors, binary sensors and device tracker are written by the
# AppDaemon app and are not in the entity registry. They do not exist after a
# Home Assistant restart until the app publishes again (normally within one poll).
template:
  # Lets the VATSIM dashboard pick between the Session Map and a placeholder.
  # Card visibility conditions are false for an entity that does not exist, so
  # they cannot test device_tracker.vatsim_aircraft before the tracker's first
  # publish. This entity always exists: off until the aircraft has a latitude
  # (missing entity, never flown, failed restore), on once it does.
  - binary_sensor:
      - name: VATSIM aircraft has position
        unique_id: vatsim_aircraft_has_position
        icon: mdi:map-marker-check
        state: "{{ state_attr('device_tracker.vatsim_aircraft', 'latitude') is not none }}"

input_boolean:
  vatsim_alerts_immediate:
    name: VATSIM alert - ATC online
    icon: mdi:bell

  vatsim_alerts_lookahead:
    name: VATSIM alert - ATC ahead (lookahead)
    icon: mdi:bell-outline

  # No initial: off on first creation, then restores.
  vatsim_alerts_atis:
    name: VATSIM alert - ATIS letter change
    icon: mdi:information-outline

  # Set after the "tracker not publishing" push call returns, cleared
  # when the tracker publishes again. No initial: restores.
  vatsim_tracker_silent_alerted:
    name: VATSIM tracker silent alerted
    icon: mdi:radar

input_datetime:
  # Last "gate unavailable" push, for the watchdog's once per
  # episode / 24 h rule. No initial: restores.
  vatsim_audio_gate_last_alert:
    name: VATSIM audio gate last alert
    has_date: true
    has_time: true
  # When the gate was first seen broken in the
  # current episode; cleared (set to 1970) when it is seen healthy. A predicate
  # clock that survives attach and churn between unknown and unavailable.
  vatsim_audio_gate_broken_since:
    name: VATSIM audio gate broken since
    has_date: true
    has_time: true
  # The aircraft-position watchdog's episode clock and last
  # push, same scheme as the mute gate pair above. No initial: restores.
  vatsim_position_missing_since:
    name: VATSIM position missing since
    has_date: true
    has_time: true
  vatsim_position_last_alert:
    name: VATSIM position last alert
    has_date: true
    has_time: true

# Type an airport (KJFK) to show its ATIS on the dashboard's ATIS card, connected or not.
# Blank = automatic (departure on the ground, arrival once airborne). The tracker upper-cases it.
input_text:
  vatsim_atis_airport:
    name: VATSIM ATIS airport (blank = automatic)
    icon: mdi:airport
    min: 0
    max: 5
    pattern: "^[A-Za-z0-9]{0,5}$"

input_select:
  vatsim_alert_mode:
    name: VATSIM Alert Mode
    options:
      - Disabled
      - Push + Speaker
      - Push Only
      - Speaker Only
    # No initial: with initial: Disabled, alerts reset to off on every
    # restart; without it the last selected mode is restored.
    icon: mdi:bell-cog

script:
  vatsim_announce_core:
    alias: "VATSIM: announce (core)"
    description: >-
      Called by script.vatsim_announce in vatsim_user.yaml, which supplies the
      speaker map and the TTS engine. Sends the push and speaks on every
      speaker whose toggle is on, subject to the alert mode. If
      input_text.vatsim_mute_gate names an entity, nothing is spoken unless
      that entity reads off, checked before every speaker call. The push still
      goes and notes that speakers were held.
    fields:
      title:
        description: Optional push title
      message:
        description: Text to send/speak
      tts_engine:
        description: TTS entity used for speech, for example tts.google_translate_en_com
      speakers:
        description: Mapping of speaker toggle (input_boolean) to media_player
    sequence:
      - variables:
          push_enabled: "{{ states('input_select.vatsim_alert_mode') in ['Push + Speaker', 'Push Only'] }}"
          audio_enabled: "{{ states('input_select.vatsim_alert_mode') in ['Push + Speaker', 'Speaker Only'] }}"
          targets: >
            {%- set ns = namespace(list=[]) -%}
            {%- if speakers is mapping -%}
              {%- for toggle, player in speakers.items() -%}
                {%- if is_state(toggle, 'on') -%}
                  {%- set ns.list = ns.list + [player] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}
            {{ ns.list }}
          # Optional mute gate. Blank (or anything that is not an entity id)
          # means no gate. With a gate, speech only while it reads off; a
          # missing or unavailable gate entity holds speech too.
          gate_entity: "{{ states('input_text.vatsim_mute_gate') | trim }}"
          gate_configured: "{{ '.' in gate_entity }}"
          gate_state: "{{ states(gate_entity) if gate_configured else 'off' }}"
          held: "{{ audio_enabled and targets | length > 0 and gate_state != 'off' }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ push_enabled }}"
            sequence:
              # A failed push must not stop the speaker calls below.
              - action: script.vatsim_notify
                continue_on_error: true
                data:
                  title: "{{ title | default('VATSIM Alert') }}"
                  message: >-
                    {{ message }}{{ ' (speakers held: mute gate ' ~ gate_state ~ ')' if held else '' }}
      # A broken gate is not the condition the gate exists for; say so locally.
      # vatsim_audio_gate_watchdog sends the push.
      - if:
          - condition: template
            value_template: "{{ held and gate_state not in ['on', 'off'] }}"
        then:
          - action: persistent_notification.create
            continue_on_error: true
            data:
              notification_id: vatsim_speech_held
              title: "VATSIM speech held"
              message: >-
                {{ gate_entity }} is {{ gate_state }}, so
                VATSIM speech was skipped: {{ message }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ audio_enabled and (targets | length > 0) }}"
            sequence:
              - repeat:
                  for_each: "{{ targets }}"
                  sequence:
                    # Re-checked per speaker: a gate that turns on during
                    # this loop stops the remaining calls.
                    - if:
                        - condition: template
                          value_template: "{{ not gate_configured or is_state(gate_entity, 'off') }}"
                      then:
                        - action: tts.speak
                          target:
                            entity_id: "{{ tts_engine }}"
                          data:
                            media_player_entity_id: "{{ repeat.item }}"
                            message: "{{ message }}"
    mode: parallel

  vatsim_cycle_alert_mode:
    alias: "VATSIM: cycle alert mode"
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.vatsim_alert_mode
                state: "Disabled"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vatsim_alert_mode
                data:
                  option: "Push + Speaker"

          - conditions:
              - condition: state
                entity_id: input_select.vatsim_alert_mode
                state: "Push + Speaker"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vatsim_alert_mode
                data:
                  option: "Push Only"

          - conditions:
              - condition: state
                entity_id: input_select.vatsim_alert_mode
                state: "Push Only"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vatsim_alert_mode
                data:
                  option: "Speaker Only"

          - conditions:
              - condition: state
                entity_id: input_select.vatsim_alert_mode
                state: "Speaker Only"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.vatsim_alert_mode
                data:
                  option: "Disabled"
    mode: single

automation:
  - alias: "VATSIM ATC online alert"
    id: vatsim_atc_online_alert
    triggers:
      - trigger: state
        entity_id: binary_sensor.vatsim_atc_coverage
        attribute: last_change_reason
        to: "became_controlled"
    conditions:
      - condition: state
        entity_id: input_boolean.vatsim_alerts_immediate
        state: "on"
    actions:
      - delay: "00:00:20"
      - condition: state
        entity_id: binary_sensor.vatsim_atc_coverage
        state: "on"
      - condition: template
        value_template: >-
          {{ state_attr('binary_sensor.vatsim_atc_coverage', 'controller_callsign')
             not in [none, '', 'unknown'] }}
      - action: script.vatsim_announce
        data:
          title: "VATSIM ATC Online"
          message: >-
            Attention. ATC is now online:
            {{ state_attr('binary_sensor.vatsim_atc_coverage', 'controller_callsign') }}.
    mode: restart

  - alias: "VATSIM lookahead alert"
    id: vatsim_lookahead_alert
    triggers:
      - trigger: state
        entity_id: sensor.vatsim_next_sector
    conditions:
      - condition: state
        entity_id: input_boolean.vatsim_alerts_lookahead
        state: "on"
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none }}
      - condition: template
        value_template: >-
          {{ trigger.from_state.state != trigger.to_state.state
             or trigger.from_state.attributes.get('controller_callsign') !=
                trigger.to_state.attributes.get('controller_callsign') }}
      - condition: template
        value_template: >-
          {{ states('sensor.vatsim_next_sector') not in
             ['unknown', 'unavailable', 'none', 'matches',
              'skipped_low_speed', 'skipped_unstable_heading',
              'skipped_insufficient_history'] }}
      # 'differs' also covers projected_uncontrolled (leaving controlled
      # airspace), which has no controller; it announced "up ahead".
      - condition: template
        value_template: >-
          {{ state_attr('sensor.vatsim_next_sector', 'controller_callsign')
             not in [none, '', 'unknown'] }}
    actions:
      - action: script.vatsim_announce
        data:
          title: "VATSIM Next ATC"
          message: >-
            Heads up. Next likely controller:
            {{ state_attr('sensor.vatsim_next_sector', 'controller_callsign') }}.
    mode: single

  # The ATIS letter changed for the airport the card is showing: the departure on the ground,
  # the arrival inside destination_range_nm (default 100 nm), or a typed-in airport. Both sides of the
  # change must be the same state and airport with a real letter, so entering range, taking off,
  # switching airports, or an ATIS coming online or going offline stay quiet.
  - alias: "VATSIM destination ATIS changed"
    id: vatsim_destination_atis_changed
    triggers:
      - trigger: state
        entity_id: sensor.vatsim_destination
        attribute: atis_code
    conditions:
      - condition: state
        entity_id: input_boolean.vatsim_alerts_atis
        state: "on"
      # Only while connected. A typed-in airport (state selected) stays selected offline, and
      # its ATIS letter changes about hourly, which pushed for hours after a session.
      - condition: state
        entity_id: binary_sensor.vatsim_pilot_connected
        state: "on"
      - condition: template
        value_template: >-
          {% set f = trigger.from_state %}{% set t = trigger.to_state %}
          {{ f is not none and t is not none
             and f.state == t.state and t.state in ['in_range', 'departure', 'selected']
             and f.attributes.get('airport') == t.attributes.get('airport')
             and f.attributes.get('atis_code') not in [none, '']
             and t.attributes.get('atis_code') not in [none, ''] }}
      # The tracker's own flag, in the same write as the letter. Holds when a
      # failed presence-off write leaves pilot_connected on. Missing flag: quiet.
      - condition: template
        value_template: "{{ trigger.to_state.attributes.get('session') == 'connected' }}"
    actions:
      # Mode queued, so a run can start after the session ended.
      - condition: state
        entity_id: binary_sensor.vatsim_pilot_connected
        state: "on"
      - condition: template
        value_template: "{{ state_attr('sensor.vatsim_destination', 'session') == 'connected' }}"
      - action: script.vatsim_announce
        data:
          title: "VATSIM ATIS"
          # Phonetic letter so the speakers say "information Lima", not "information L".
          message: >-
            {% set p = {'A':'Alpha','B':'Bravo','C':'Charlie','D':'Delta','E':'Echo','F':'Foxtrot',
                        'G':'Golf','H':'Hotel','I':'India','J':'Juliett','K':'Kilo','L':'Lima',
                        'M':'Mike','N':'November','O':'Oscar','P':'Papa','Q':'Quebec','R':'Romeo',
                        'S':'Sierra','T':'Tango','U':'Uniform','V':'Victor','W':'Whiskey',
                        'X':'X-ray','Y':'Yankee','Z':'Zulu'} %}
            {% set c = trigger.to_state.attributes.atis_code | string | upper %}
            {{ trigger.to_state.attributes.airport }} ATIS is now information {{ p.get(c, c) }}.
    mode: queued

  - alias: "VATSIM: feed unhealthy"
    id: vatsim_feed_unhealthy_v2
    # Replaces the orphaned vatsim_feed_unhealthy automation. Notifies directly
    # rather than via script.vatsim_announce, which is gated by
    # input_select.vatsim_alert_mode and would suppress health alerts.
    #
    # All three triggers are templates, not numeric_state / state.
    # sensor.vatsim_feed_health is pushed from AppDaemon over the REST API. On a
    # host reboot or Supervisor update, AppDaemon is still starting when Core
    # loads automations, so a numeric_state trigger against a not-yet-existing
    # entity fails to initialize and never retries. A Core-only restart does not
    # reproduce this, which is why it went unnoticed. Do not simplify these back.
    triggers:
      # VATSIM fetch failing while the tracker is alive. The old test on
      # feed_age_seconds never fired: a failed fetch publishes it as null (0),
      # and a dead tracker freezes it. A dead tracker belongs to
      # vatsim_tracker_silent_watchdog, so this requires the health
      # sensor to have updated within 150 s (max backoff 60 s plus jitter) and
      # no successful fetch for 180 s. now() re-renders it every minute. No
      # successful fetch yet (null) reads as 0 and does not fire.
      - trigger: template
        value_template: >-
          {% set fh = states.sensor.vatsim_feed_health %}
          {% set last = state_attr('sensor.vatsim_feed_health', 'last_success_ts') | float(0) %}
          {{ fh is not none and last > 0
             and as_timestamp(now()) - last > 180
             and as_timestamp(now()) - as_timestamp(fh.last_updated) < 150 }}
        for: "00:02:00"
        id: feed_stale
      # Navdata parsed partially or not at all. Correct value is 0, and 0 is
      # dropped from the published state entirely (the
      # attribute is absent while healthy), so int(0) restores the intended sense.
      # A whole-load failure leaves the issue count at 0, so the status test
      # catches it. 'expired' (past the AIRAC validity end) pushes once when
      # it turns true; template triggers do not fire on a value already true. 'disabled' (no navdata_path) never fires. The 5 min hold
      # covers the startup parse; a slower parse alerts once.
      - trigger: template
        value_template: >-
          {{ state_attr('sensor.vatsim_feed_health','navdata_load_issue_count') | int(0) > 0
             or state_attr('sensor.vatsim_feed_health','navdata_status')
                in ['configured_but_unloaded', 'configured_but_empty', 'expired'] }}
        for: "00:05:00"
        id: navdata_degraded
      # Coverage geometry unusable, so ATC alerts stop firing silently.
      # Tests geometry_status, NOT coverage_evaluation_ready: AppDaemon
      # publishes that bool as the STRING "true", so `is not true` is always
      # True and fired a false alarm. Both come from `self._geometry is not
      # None` in the tracker, so this is the same signal without the
      # serialization trap. `gs is not none` means a missing attribute does not
      # fire, biased toward under-alerting when instrumentation is partial.
      - trigger: template
        value_template: >-
          {% set gs = state_attr('sensor.vatsim_feed_health','geometry_status') %}
          {{ states('sensor.vatsim_feed_health') not in ['unknown', 'unavailable']
             and gs is not none and gs != 'ready'
             and is_state('binary_sensor.vatsim_pilot_connected', 'on') }}
        for: "00:05:00"
        id: coverage_down
      # The gate above moved into the trigger. As an action condition it
      # dropped the one firing that happened while not connected, and the
      # template, still true, never fired again when you connected.
      # The feed fetched fine but the tracker failed to process it, so
      # last_success_ts stays fresh and feed_stale cannot see it.
      - trigger: template
        value_template: >-
          {{ state_attr('sensor.vatsim_feed_health','timestamp_status') == 'processing_error' }}
        for: "00:05:00"
        id: processing_error
    actions:
      - choose:
          # Navdata: no pilot-connected gate. You want this on the ground,
          # before a flight, not once airborne.
          - conditions:
              - condition: trigger
                id: navdata_degraded
            sequence:
              - action: script.vatsim_notify
                data:
                  title: "VATSIM navdata degraded"
                  message: >-
                    {% set h = 'sensor.vatsim_feed_health' %}{% if state_attr(h,'navdata_status') == 'expired' %}Navdata
                    AIRAC {{ state_attr(h,'navdata_cycle') or 'unknown' }} expired on
                    {{ state_attr(h,'navdata_valid_until') }}: update it and the tracker
                    reloads within an hour.{% else %}Navdata loaded with
                    {{ state_attr(h,'navdata_load_issue_count') | int(0) }}
                    issues (status: {{ state_attr(h,'navdata_status') }}).{% set e = state_attr(h,'last_navdata_refresh_error') %}{{ ' ' ~ (e | string)[:300] if e else '' }}{% endif %}
          # Feed stale: gated on an active session to avoid idle-hours noise.
          # Deliberately conservative, a tracker that dies while you are not
          # flying will not page you.
          - conditions:
              - condition: trigger
                id: feed_stale
              - condition: state
                entity_id: binary_sensor.vatsim_pilot_connected
                state: "on"
            sequence:
              - action: script.vatsim_notify
                data:
                  title: "VATSIM feed stale"
                  message: >-
                    No successful VATSIM fetch in
                    {{ (as_timestamp(now())
                        - state_attr('sensor.vatsim_feed_health','last_success_ts') | float(0))
                       | int }} s; the tracker is running
                    ({{ state_attr('sensor.vatsim_feed_health','consecutive_failures') | int(0) }}
                    failures in a row).
                  # One notification per outage. A later tracker-silent push
                  # with this tag replaces this one, without a second alert while it is showing.
                  tag: vatsim_tracker_outage
          - conditions:
              - condition: trigger
                id: coverage_down
              - condition: state
                entity_id: binary_sensor.vatsim_pilot_connected
                state: "on"
            sequence:
              - action: script.vatsim_notify
                data:
                  title: "VATSIM coverage evaluation down"
                  message: >-
                    Geometry status:
                    {{ state_attr('sensor.vatsim_feed_health','geometry_status') }}.
                    ATC alerts will not fire.
          # Not session-gated; a processing fault can hide the session itself.
          - conditions:
              - condition: trigger
                id: processing_error
            sequence:
              - action: script.vatsim_notify
                data:
                  title: "VATSIM tracker processing error"
                  message: >-
                    The feed is reachable but the tracker has failed to process it
                    for 5 min. Check the AppDaemon log for the traceback.
    mode: single

  - alias: "VATSIM: mute gate unavailable"
    id: vatsim_audio_gate_watchdog
    description: >-
      Only active when input_text.vatsim_mute_gate names an entity. VATSIM
      speech plays only while that entity reads off, so a broken gate (missing,
      unknown or unavailable) silences it: the safe direction, but silent.
      With no gate configured this automation does nothing.

      The episode clock is
      input_datetime.vatsim_audio_gate_broken_since: set when the gate is first
      seen broken (by the 15 min template trigger, or by an hourly sweep for a
      gate already broken at load), cleared when it is seen healthy. Churn
      between unknown and unavailable does not move it.
        broken trigger   predicate true 15 min: push if this episode has not
                         been pushed (or the last push is over 24 h old)
        hourly sweep     healthy: dismiss the notice, clear the clock;
                         broken: start the clock, or push once it is 15 min old
        ok trigger       healthy 5 min: dismiss and clear
      Last push: input_datetime.vatsim_audio_gate_last_alert. Missing helpers
      read as never set: no sweep push (the broken trigger still reports) and
      no dedup (pushes hourly, the loud side).
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >-
          {%- set g = states('input_text.vatsim_mute_gate') | trim -%}
          {{ '.' in g and states(g) not in ['on', 'off'] }}
        for: "00:15:00"
        id: broken
      - trigger: template
        value_template: >-
          {%- set g = states('input_text.vatsim_mute_gate') | trim -%}
          {{ '.' in g and states(g) in ['on', 'off'] }}
        for: "00:05:00"
        id: ok
      - trigger: time_pattern
        minutes: "7"
        id: sweep
    variables:
      gate_entity: "{{ states('input_text.vatsim_mute_gate') | trim }}"
      gate_configured: "{{ '.' in gate_entity }}"
      broken_now: >-
        {{ gate_configured and states(gate_entity) not in ['on', 'off'] }}
      # Below 1e9 means unset (cleared to 1970, missing, or never written).
      bs_raw: "{{ state_attr('input_datetime.vatsim_audio_gate_broken_since', 'timestamp') | float(0) }}"
      bs_set: "{{ bs_raw > 1000000000 }}"
      # The broken trigger proves 15 min of predicate; the sweep needs its clock.
      bs_eff: >-
        {{ bs_raw if bs_set else (as_timestamp(now()) - 900 if trigger.id == 'broken' else as_timestamp(now())) }}
      la: "{{ state_attr('input_datetime.vatsim_audio_gate_last_alert', 'timestamp') | float(0) }}"
      # <= not <. A new input_datetime defaults to install-day
      # midnight, so last_alert and broken_since can start equal; equal means no
      # push yet. A real push always writes now, after the episode start.
      fresh: >-
        {{ la < 1000000000 or as_timestamp(now()) - la > 86400 or la <= bs_eff }}
      push: >-
        {{ broken_now and fresh
           and (trigger.id == 'broken'
                or (trigger.id == 'sweep' and bs_set and as_timestamp(now()) - bs_raw >= 900)) }}
    conditions:
      # No gate configured and no episode to clean up: nothing to do, so an
      # install without a gate sees no runs, notices or pushes from this.
      - condition: template
        value_template: "{{ gate_configured or bs_set }}"
      - condition: template
        value_template: >-
          {{ trigger.id == 'sweep'
             or (trigger.id == 'ok' and not broken_now)
             or (trigger.id == 'broken' and broken_now) }}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not broken_now }}"
            sequence:
              - action: persistent_notification.dismiss
                continue_on_error: true
                data:
                  notification_id: vatsim_audio_gate
              - if:
                  - condition: template
                    value_template: "{{ bs_set }}"
                then:
                  - action: input_datetime.set_datetime
                    continue_on_error: true
                    target:
                      entity_id: input_datetime.vatsim_audio_gate_broken_since
                    data:
                      timestamp: 0
        default:
          - if:
              - condition: template
                value_template: "{{ not bs_set }}"
            then:
              - action: input_datetime.set_datetime
                continue_on_error: true
                target:
                  entity_id: input_datetime.vatsim_audio_gate_broken_since
                data:
                  timestamp: "{{ bs_eff }}"
          - if:
              - condition: template
                value_template: "{{ push }}"
            then:
              - action: input_datetime.set_datetime
                continue_on_error: true
                target:
                  entity_id: input_datetime.vatsim_audio_gate_last_alert
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
              - action: persistent_notification.create
                continue_on_error: true
                data:
                  notification_id: vatsim_audio_gate
                  title: "VATSIM mute gate unavailable"
                  message: >-
                    {{ gate_entity }} is {{ states(gate_entity) }}. VATSIM
                    speech is held until it reads on or off. Check that
                    entity, or clear input_text.vatsim_mute_gate in
                    vatsim_user.yaml to run without a gate.
              - action: script.vatsim_notify
                continue_on_error: true
                data:
                  title: "VATSIM mute gate unavailable"
                  message: >-
                    VATSIM speech held: {{ gate_entity }} is
                    {{ states(gate_entity) }}.

  - alias: "VATSIM: aircraft position missing"
    id: vatsim_aircraft_position_watchdog
    description: >-
      Watchdog for the tracker's restart-survival path
      (_reconcile_published_states and vatsim_last_aircraft.json in the
      AppDaemon apps dir). The Session Map's initial view needs a latitude on
      device_tracker.vatsim_aircraft; without one it renders as a blank frame
      with no error. The tracker republishes the last saved position after an
      HA or AppDaemon restart, so a healthy feed with no latitude for 10 min
      means that path failed (missing or corrupt save file, or set_state not
      sticking). Check the AppDaemon log for "aircraft position" and
      "republishing". Gated on a healthy feed so a dead tracker, which
      vatsim_feed_unhealthy_v2 owns, does not page twice. Notifies directly,
      not via script.vatsim_announce, for the same reason as that automation.

      Same scheme as
      vatsim_audio_gate_watchdog. A template trigger that is already true when
      automations load never fires, so a 5 min sweep keeps its own episode clock
      (input_datetime.vatsim_position_missing_since) and pushes once it is
      10 min old. Last push: input_datetime.vatsim_position_last_alert (once
      per episode, again after 24 h). Missing helpers read as never set: no
      sweep push (the missing trigger still reports) and no dedup.
    mode: single
    max_exceeded: silent
    triggers:
      # Template, not state: both entities are pushed over REST and do not
      # exist when Core loads automations. state_attr on a missing entity is
      # none, so "entity missing" and "entity without position" both match.
      - trigger: template
        value_template: >-
          {{ states('sensor.vatsim_feed_health') == 'healthy'
             and state_attr('device_tracker.vatsim_aircraft', 'latitude') is none }}
        for: "00:10:00"
        id: missing
      # Complement of the missing predicate with the same 10 min dwell.
      - trigger: template
        value_template: >-
          {{ not (states('sensor.vatsim_feed_health') == 'healthy'
                  and state_attr('device_tracker.vatsim_aircraft', 'latitude') is none) }}
        for: "00:10:00"
        id: ok
      - trigger: time_pattern
        minutes: "/5"
        id: sweep
    variables:
      missing_now: >-
        {{ states('sensor.vatsim_feed_health') == 'healthy'
           and state_attr('device_tracker.vatsim_aircraft', 'latitude') is none }}
      # Below 1e9 means unset (cleared to 1970, missing, or never written). Exactly
      # 00:00:00 is also unset: a new input_datetime starts at install-day midnight,
      # which would read as an episode already hours old.
      ms_raw: "{{ state_attr('input_datetime.vatsim_position_missing_since', 'timestamp') | float(0) }}"
      ms_set: >-
        {{ ms_raw > 1000000000
           and not (states('input_datetime.vatsim_position_missing_since') | string).endswith(' 00:00:00') }}
      # The missing trigger proves 10 min of predicate; the sweep needs its clock.
      ms_eff: >-
        {{ ms_raw if ms_set else (as_timestamp(now()) - 600 if trigger.id == 'missing' else as_timestamp(now())) }}
      la: "{{ state_attr('input_datetime.vatsim_position_last_alert', 'timestamp') | float(0) }}"
      # <= not <: a new input_datetime defaults to install-day midnight, so both
      # helpers can start equal; equal means no push yet.
      fresh: >-
        {{ la < 1000000000 or as_timestamp(now()) - la > 86400 or la <= ms_eff }}
      push: >-
        {{ missing_now and fresh
           and (trigger.id == 'missing'
                or (trigger.id == 'sweep' and ms_set and as_timestamp(now()) - ms_raw >= 600)) }}
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.id == 'sweep'
             or (trigger.id == 'ok' and not missing_now)
             or (trigger.id == 'missing' and missing_now) }}
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not missing_now }}"
            sequence:
              - action: persistent_notification.dismiss
                continue_on_error: true
                data:
                  notification_id: vatsim_position_missing
              - if:
                  - condition: template
                    value_template: "{{ ms_set }}"
                then:
                  - action: input_datetime.set_datetime
                    continue_on_error: true
                    target:
                      entity_id: input_datetime.vatsim_position_missing_since
                    data:
                      timestamp: 0
        default:
          - if:
              - condition: template
                value_template: "{{ not ms_set }}"
            then:
              - action: input_datetime.set_datetime
                continue_on_error: true
                target:
                  entity_id: input_datetime.vatsim_position_missing_since
                data:
                  timestamp: "{{ ms_eff }}"
          - if:
              - condition: template
                value_template: "{{ push }}"
            then:
              - action: input_datetime.set_datetime
                continue_on_error: true
                target:
                  entity_id: input_datetime.vatsim_position_last_alert
                data:
                  timestamp: "{{ as_timestamp(now()) }}"
              - action: persistent_notification.create
                continue_on_error: true
                data:
                  notification_id: vatsim_position_missing
                  title: "VATSIM map has no aircraft position"
                  message: >-
                    device_tracker.vatsim_aircraft is
                    {{ 'missing' if states.device_tracker.vatsim_aircraft is none
                       else 'present without a position' }}
                    while the feed is healthy. The Session Map will be blank. Check
                    the AppDaemon log for the restore and save-file messages.
              - action: script.vatsim_notify
                continue_on_error: true
                data:
                  title: "VATSIM map has no aircraft position"
                  message: >-
                    device_tracker.vatsim_aircraft is
                    {{ 'missing' if states.device_tracker.vatsim_aircraft is none
                       else 'present without a position' }}
                    while the feed is healthy. The Session Map will be blank. Check
                    the AppDaemon log for the restore and save-file messages.

  - alias: "VATSIM: tracker not publishing"
    id: vatsim_tracker_silent_watchdog
    description: >-
      The AppDaemon tracker republishes
      sensor.vatsim_feed_health on every poll (about 18 s; feed_age_seconds
      changes each time, so last_updated moves). A tracker that stops (AppDaemon
      crash, app error) leaves every vatsim entity frozen at its last value,
      feed_age_seconds included (about 18 s), so vatsim_feed_unhealthy_v2's
      feed_stale never fires and binary_sensor.vatsim_pilot_connected cannot be
      trusted. This tests freshness instead, with no pilot gate: a dead tracker
      is reported once per episode whether or not a session is active.
        silent trigger   last_updated more than 180 s old (10 polls)
        start trigger    10 min after HA starts: the sensor missing (REST
                         entities are gone after an HA restart until the
                         tracker republishes, normally within about 20 s) or
                         stale
        sweep (/15)      a sensor already stale when automations load; it does
                         not treat a missing sensor as silent (that case is
                         the start trigger's), so a sweep landing in the
                         seconds after an HA restart cannot page
        ok trigger       fresh for 2 min: clear the episode, dismiss
      Episode flag: input_boolean.vatsim_tracker_silent_alerted, set after the
      push call returns, so a push that raises is retried by the next sweep. The
      push call returns, so a push that raises is retried by the next sweep. A
      notify service that only logs an error is not retried. A missing flag pushes on every sweep (the loud side).
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: template
        value_template: >-
          {% set s = states.sensor.vatsim_feed_health %}
          {{ s is not none and (now() - s.last_updated).total_seconds() > 180 }}
        id: silent
      - trigger: template
        value_template: >-
          {% set s = states.sensor.vatsim_feed_health %}
          {{ s is not none and (now() - s.last_updated).total_seconds() < 60 }}
        for: "00:02:00"
        id: ok
      - trigger: homeassistant
        event: start
        id: start
      - trigger: time_pattern
        minutes: "/15"
        id: sweep
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - delay:
              minutes: 10
      - variables:
          # Seconds since the last publish; -1 when the sensor does not exist.
          s_age: >-
            {% set s = states.sensor.vatsim_feed_health %}
            {{ ((now() - s.last_updated).total_seconds() | round(0) | int) if s is not none else -1 }}
          silent: "{{ s_age > 180 or (s_age < 0 and trigger.id == 'start') }}"
          alerted: "{{ is_state('input_boolean.vatsim_tracker_silent_alerted', 'on') }}"
          what: >-
            {% if s_age < 0 %}sensor.vatsim_feed_health is missing 10 min after HA started
            {%- else %}sensor.vatsim_feed_health last updated {{ (s_age / 60) | round(0) | int }} min ago{% endif %}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ s_age >= 0 and not silent and alerted }}"
            sequence:
              - action: input_boolean.turn_off
                continue_on_error: true
                target:
                  entity_id: input_boolean.vatsim_tracker_silent_alerted
              - action: persistent_notification.dismiss
                continue_on_error: true
                data:
                  notification_id: vatsim_tracker_silent
          - conditions:
              - condition: template
                value_template: "{{ silent and not alerted }}"
            sequence:
              # Stored locally first, so it survives a push that cannot be delivered.
              - action: persistent_notification.create
                continue_on_error: true
                data:
                  notification_id: vatsim_tracker_silent
                  title: "VATSIM tracker not publishing"
                  message: >-
                    {{ what }}. ATC announcements, the lookahead and the Session Map
                    are frozen. Check the AppDaemon add-on and its log.
              # No continue_on_error: a push that raises is retried. One the notify service
              # only logs is not.
              - action: script.vatsim_notify
                data:
                  title: "VATSIM tracker not publishing"
                  message: >-
                    {{ what }}. ATC announcements and the map are frozen. Check AppDaemon.
                  # Replaces a feed-stale push from the same outage.
                  tag: vatsim_tracker_outage
              - action: input_boolean.turn_on
                continue_on_error: true
                target:
                  entity_id: input_boolean.vatsim_tracker_silent_alerted
